services:
  postgres:
    image: postgres:16
    container_name: btp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER env var is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}"
      POSTGRES_DB: "${POSTGRES_DB:-bettracker}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: btp-backend
    restart: unless-stopped
    command: uvicorn server:app --host 0.0.0.0 --port 8001 --reload
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL env var is required}"
      RUN_MIGRATIONS_ON_STARTUP: "true"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET env var is required}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: "lax"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20
    container_name: btp-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "yarn install && yarn start"
    environment:
      REACT_APP_BACKEND_URL: ""
      BACKEND_PROXY: "http://backend:8001"
      HOST: "0.0.0.0"
      PORT: "3000"
      CI: "false"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:

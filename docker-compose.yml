services:
  mongo:
    image: mongo:7
    container_name: btp-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: btp-backend
    restart: unless-stopped
    command: uvicorn server:app --host 0.0.0.0 --port 8001 --reload
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      MONGO_URL: "mongodb://mongo:27017"
      DB_NAME: "bettracker"
      JWT_SECRET: "valtoztasd-meg-egy-hosszu-veletlen-titokra"
      ODDS_API_KEY: "707d626d086077945c45a2aca1b9da1e"
      ODDS_API_BASE: "https://api.the-odds-api.com/v4"
      CORS_ORIGINS: "http://localhost:3000"
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: "lax"
      ADMIN_EMAIL: "admin@bettracker.pro"
      ADMIN_PASSWORD: "admin123"
    ports:
      - "8001:8001"
    depends_on:
      - mongo

  frontend:
    image: node:20
    container_name: btp-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "yarn install && yarn start"
    environment:
      REACT_APP_BACKEND_URL: ""
      BACKEND_PROXY: "http://backend:8001"
      HOST: "0.0.0.0"
      PORT: "3000"
      CI: "false"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
  frontend_node_modules:
